<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bampot Life OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div id="calendar">
                <div class="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <h2 id="current-month-year"></h2>
                    <button id="next-month">&gt;</button>
                </div>
                <div class="calendar-grid-header">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>

            <div id="categories">
                <h3>Categories</h3>
                <ul id="category-list">
                    <!-- Categories will be rendered here -->
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="selected-date-display">Select a Date</h1>
            </header>

            <div class="add-task-container">
                <input type="text" id="new-task-input" placeholder="Add a new task...">
                <select id="new-task-category">
                    <!-- Categories will be populated here -->
                </select>
                <input type="time" id="new-task-time" title="Set a reminder time">
                <button id="add-task-btn">Add Task</button>
            </div>
            <div class="notification-request" id="notification-request" style="display: none;">
                <p>Enable notifications to get reminders for your tasks!</p>
                <button id="enable-notifications-btn">Enable</button>
            </div>

            <div class="tasks-container">
                <ul id="task-list">
                    <!-- Tasks will be rendered here -->
                </ul>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
